name: ESP-IDF build

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: esp-idf-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ESP32-C3 firmware
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build firmware with ESP-IDF 5.3
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.3
          target: esp32c3
          path: .
          command: >-
            idf.py build &&
            esptool.py --chip esp32c3 merge_bin
            -o build/electronic_load_esp32c3_full.bin
            --flash_mode dio --flash_freq 80m --flash_size 4MB
            0x0 build/bootloader/bootloader.bin
            0x8000 build/partition_table/partition-table.bin
            0x10000 build/electronic_load.bin

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: electronic-load-esp32c3-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 1
          path: |
            build/electronic_load.bin
            build/electronic_load_esp32c3_full.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/flasher_args.json

  release:
    name: Publish firmware release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    permissions:
      contents: write
      actions: read

    steps:
      - name: Download firmware artifacts
        uses: actions/download-artifact@v4
        with:
          name: electronic-load-esp32c3-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          generate_release_notes: true
          files: |
            dist/electronic_load_esp32c3_full.bin
            dist/electronic_load.bin
            dist/bootloader/bootloader.bin
            dist/partition_table/partition-table.bin
            dist/flasher_args.json

      - name: Delete previous releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CURRENT_TAG: ${{ github.ref_name }}
        run: |
          gh release list --limit 100 --json tagName \
            --jq '.[].tagName' |
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            [ "$tag" = "$CURRENT_TAG" ] && continue

            echo "Deleting previous release: $tag"
            gh release delete "$tag" --yes --cleanup-tag
          done
          
